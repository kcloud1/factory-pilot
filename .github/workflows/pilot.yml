name: Pilot checks and pinned Git release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dry-run
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WRANGLER_SEND_METRICS: "false"
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    uses: kcloud1/cloud-app-factory/.github/workflows/factory-pilot-publish.yml@d60d213b3fa77510deb29b084b0efa802c7c16a4
    with:
      factory_revision: d60d213b3fa77510deb29b084b0efa802c7c16a4
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
