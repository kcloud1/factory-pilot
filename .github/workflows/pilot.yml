name: Pilot checks and pinned no-write release gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dry-run
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WRANGLER_SEND_METRICS: "false"
  release-gate:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    uses: kcloud1/cloud-app-factory/.github/workflows/factory-release-gate.yml@3959514315dbd314f55e30d34b3b8201ce8e80b3
    with:
      factory_revision: 3959514315dbd314f55e30d34b3b8201ce8e80b3
      plan_path: deployment/plan.json
      worker: factory-pilot
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
